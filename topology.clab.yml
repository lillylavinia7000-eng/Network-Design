name: multi-subnet-lab

topology:
  nodes:
    # --- Router ---
    router:
      kind: linux
      image: frrouting/frr:latest
      exec:
        - ip link set eth1 up
        - ip link set eth2 up
        - ip address replace 192.168.10.1/24 dev eth1
        - ip address replace 192.168.20.1/24 dev eth2
        - sysctl -w net.ipv4.ip_forward=1

    # --- Switches (Alpine Containers with Linux Bridge) ---
    switch-a:
      kind: linux
      image: alpine:latest
      labels:
        graph-icon: switch
        graph-level: 2
      exec:
        - ip link set eth1 up
        - ip link set eth2 up
        - ip link add br0 type bridge
        - ip link set eth1 master br0
        - ip link set eth2 master br0
        - ip link set br0 up

    switch-b:
      kind: linux
      image: alpine:latest
      labels:
        graph-icon: switch
        graph-level: 2
      exec:
        - ip link set eth1 up
        - ip link set eth2 up
        - ip link add br0 type bridge
        - ip link set eth1 master br0
        - ip link set eth2 master br0
        - ip link set br0 up

    # --- Subnet A Host ---
    host-a:
      kind: linux
      image: alpine:latest
      labels:
        graph-icon: host
        graph-level: 3
      exec:
        - ip link set eth1 up
        - ip addr add 192.168.10.2/24 dev eth1
        - ip route replace default via 192.168.10.1 dev eth1

    # --- Subnet B Host ---
    host-b:
      kind: linux
      image: alpine:latest
      labels:
        graph-icon: host
        graph-level: 3
      exec:
        - ip link set eth1 up
        - ip addr add 192.168.20.2/24 dev eth1
        - ip route replace default via 192.168.20.1 dev eth1

  links:
    # Subnet A (192.168.10.0/24)
    - endpoints: ["host-a:eth1", "switch-a:eth1"]
    - endpoints: ["router:eth1", "switch-a:eth2"]

    # Subnet B (192.168.20.0/24)
    - endpoints: ["host-b:eth1", "switch-b:eth1"]
    - endpoints: ["router:eth2", "switch-b:eth2"]
